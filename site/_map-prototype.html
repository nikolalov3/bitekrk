<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District map prototype — BiteKrakow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .map-section { padding: 56px 0 80px; }
    .map-wrap {
      position: relative;
      background: linear-gradient(160deg, #f6f2ea 0%, #efe8db 100%);
      border: 1px solid var(--line-dark);
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 20px 50px -30px rgba(27,27,24,0.5);
      overflow: hidden;
    }
    .krk-map { display: block; width: 100%; height: auto; }

    /* Dzielnice */
    .dist { cursor: pointer; }
    .dist .shape {
      stroke-linejoin: round;
      transition: fill .2s ease, stroke .2s ease, transform .2s ease;
      transform-box: fill-box; transform-origin: center;
    }
    .dist .d-name {
      font-family: var(--font-sans); font-weight: 600;
      fill: #4a463c; pointer-events: none;
      transition: fill .2s ease;
    }
    .dist .d-count {
      font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
      fill: #8a8578; pointer-events: none;
      transition: fill .2s ease;
    }
    .dist:hover .shape, .dist:focus-visible .shape {
      fill: var(--accent); stroke: var(--accent);
      transform: translateY(-3px);
    }
    .dist:hover .d-name, .dist:focus-visible .d-name,
    .dist:hover .d-count, .dist:focus-visible .d-count { fill: #fff; }
    .dist:focus-visible { outline: none; }

    /* Rzeka i znaczniki */
    .river { fill: none; stroke: #9fc0d4; stroke-width: 22; stroke-linecap: round; opacity: 0.9; }
    .river-label { font-family: var(--font-serif); font-style: italic; font-size: 17px; fill: #5f8aa3; }
    .wawel { pointer-events: none; }
    .wawel-dot { fill: var(--gold); }
    .wawel-label { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em; fill: #8a7530; }

    .map-legend {
      display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center;
      margin-top: 22px; font-family: var(--font-mono); font-size: 0.72rem;
      letter-spacing: 0.06em; color: var(--ink-soft); text-transform: uppercase;
    }
    .map-legend .swatch { display: inline-flex; align-items: center; gap: 8px; }
    .map-legend .box { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-dark); }

    @media (max-width: 640px) {
      .dist .d-name { font-size: 15px; }
      .dist .d-count { display: none; }
      .river-label { font-size: 14px; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/">Bite<span>Krakow</span></a>
    <nav class="site-nav">
      <a href="/guides/">Guides</a>
      <a href="/restaurants/">Places</a>
      <a href="/news/">News</a>
      <a href="/about/">About</a>
    </nav>
  </div>
</header>

<section class="wrap map-section">
  <span class="eyebrow">Prototype</span>
  <h2 class="deco">Pick your neighborhood</h2>
  <p class="section-lead">Krakow eats differently every few hundred meters. Tap a district to see where locals actually go.</p>

  <div class="map-wrap">
    <svg class="krk-map" viewBox="0 0 900 660" role="img" aria-label="Map of Krakow food districts">
      <g id="rivers"></g>
      <g id="districts"></g>
      <g id="markers"></g>
    </svg>
  </div>

  <div class="map-legend">
    <span class="swatch"><span class="box" style="background:#e7ddcb"></span> District with a full guide</span>
    <span class="swatch"><span class="box" style="background:#eee9df"></span> Covered in Places</span>
    <span class="swatch"><span class="box" style="background:#9fc0d4;border-color:#9fc0d4"></span> Vistula river</span>
  </div>
</section>

<script>
// Dzielnice: przyblizone, ale w prawdziwym ukladzie wzglednym.
// points w ukladzie 0..900 x 0..660. tone: subtelny odcien tla.
const DISTRICTS = [
  { name: "Krowodrza", href: "/krowodrza-guide/", guide: true, count: "Local & leafy",
    points: "70,66 250,50 292,146 250,210 120,202 60,136", label: [168,134] },
  { name: "Kleparz", href: "/kleparz-guide/", guide: true, count: "Market & coffee",
    points: "312,58 486,52 520,146 452,192 320,178 300,116", label: [408,124] },
  { name: "Piasek", href: "/restaurants/#piasek", guide: false, count: "Tytano & cafés",
    points: "96,232 262,216 300,314 250,386 120,366 78,294", label: [188,308] },
  { name: "Stare Miasto", href: "/old-town-cafes/", guide: true, count: "Old Town",
    points: "330,210 486,206 528,281 486,348 356,348 312,276", label: [420,286] },
  { name: "Wesoła", href: "/restaurants/#wesola", guide: false, count: "Main station",
    points: "556,202 690,210 706,296 640,336 552,316 536,254", label: [620,274] },
  { name: "Grzegórzki", href: "/restaurants/#grzegorzki", guide: false, count: "Riverside",
    points: "726,228 852,248 852,388 742,400 704,316 712,258", label: [780,326] },
  { name: "Kazimierz", href: "/kazimierz-guide/", guide: true, count: "Bars & brunch",
    points: "372,378 520,366 588,392 604,446 520,478 402,462 356,414", label: [470,426] },
  { name: "Podgórze", href: "/podgorze-guide/", guide: true, count: "Across the river",
    points: "296,522 520,512 566,568 510,628 344,632 264,574", label: [408,574] },
  { name: "Zabłocie", href: "/restaurants/#zablocie", guide: false, count: "Museums & Korean",
    points: "600,532 744,520 794,580 738,636 620,630 576,576", label: [684,584] },
];

const TONE_GUIDE = "#e7ddcb";
const TONE_PLAIN = "#eee9df";
const STROKE_GUIDE = "#e7ddcb";
const STROKE_PLAIN = "#eee9df";
const SVGNS = "http://www.w3.org/2000/svg";

function el(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}

// Rzeka Wisla: plynie z zachodu w czystej przerwie miedzy polnoca a poludniem,
// z lekkim lukiem na poludnie kolo Podgorza
const river = document.getElementById("rivers");
el("path", { class: "river",
  d: "M 12,494 C 200,480 330,498 420,502 C 520,506 582,486 660,506 C 742,527 802,548 892,556" }, river);
const rlab = el("text", { class: "river-label", x: 150, y: 476, transform: "rotate(-4 150 476)" }, river);
rlab.textContent = "Wisła";

// Dzielnice
const g = document.getElementById("districts");
for (const d of DISTRICTS) {
  const a = el("a", { class: "dist", href: d.href, "aria-label": d.name }, g);
  el("polygon", {
    class: "shape",
    points: d.points,
    fill: d.guide ? TONE_GUIDE : TONE_PLAIN,
    stroke: d.guide ? STROKE_GUIDE : STROKE_PLAIN,
    "stroke-width": 16,
  }, a);
  const [cx, cy] = d.label;
  const name = el("text", { class: "d-name", x: cx, y: cy, "text-anchor": "middle" }, a);
  name.textContent = d.name;
  const count = el("text", { class: "d-count", x: cx, y: cy + 18, "text-anchor": "middle" }, a);
  count.textContent = d.count;
}

// Wawel: maly zamek na polnocnym brzegu rzeki, kolo Kazimierza
const m = document.getElementById("markers");
const wg = el("g", { class: "wawel", transform: "translate(322 486)" }, m);
// zamek z blankami + wieza z flaga
el("path", { class: "wawel-dot",
  d: "M0,14 V4 h3 v-3 h3 v3 h3 v-3 h3 v3 h3 V4 h3 v3 h3 v-3 h3 v3 h3 v10 z" }, wg);
el("rect", { class: "wawel-dot", x: 20, y: -8, width: 5, height: 22 }, wg);
el("path", { class: "wawel-dot", d: "M25,-8 h9 l-3,3 3,3 h-9 z" }, wg); // flaga
const wl = el("text", { class: "wawel-label", x: 40, y: 8 }, wg);
wl.textContent = "WAWEL";
</script>
</body>
</html>
