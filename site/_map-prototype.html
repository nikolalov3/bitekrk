<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District map v2 — BiteKrakow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .map-section { padding: 52px 0 90px; }
    .map-wrap {
      position: relative;
      background: radial-gradient(120% 130% at 30% 0%, #f7f3ec 0%, #eee7da 70%, #e8e0d1 100%);
      border: 1px solid var(--line-dark);
      border-radius: 22px;
      padding: 6px;
      box-shadow: 0 24px 60px -34px rgba(27,27,24,0.55);
      overflow: hidden;
    }
    .krk-map { display: block; width: 100%; height: auto; }

    .dist { cursor: pointer; }
    .dist .shape {
      stroke-linejoin: round;
      transition: fill .18s ease, stroke .18s ease, transform .18s ease, filter .18s ease;
      transform-box: fill-box; transform-origin: center;
    }
    .dist .d-name { font-family: var(--font-sans); font-weight: 600; fill: #47433a; pointer-events: none; transition: fill .18s ease; }
    .dist .d-sub { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.03em; fill: #918b7d; pointer-events: none; transition: fill .18s ease; }
    .dist:hover .shape, .dist:focus-visible .shape { fill: var(--accent); stroke: var(--accent); transform: translateY(-3px); filter: drop-shadow(0 10px 16px rgba(188,90,52,0.3)); }
    .dist:hover .d-name, .dist:focus-visible .d-name, .dist:hover .d-sub, .dist:focus-visible .d-sub { fill: #fff; }
    .dist.mini .shape { stroke-dasharray: 5 4; opacity: 0.92; }
    .dist:focus-visible { outline: none; }

    .river { fill: none; stroke: #a3c1d6; stroke-width: 20; stroke-linecap: round; opacity: 0.95; }
    .river-2 { fill: none; stroke: #b7d0e0; stroke-width: 9; stroke-linecap: round; opacity: 0.7; }
    .river-label { font-family: var(--font-serif); font-style: italic; font-size: 18px; fill: #5c86a0; }
    .wawel-dot { fill: var(--gold); }
    .wawel-label { font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.1em; fill: #8a7530; }
    .compass { font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.1em; fill: #b3ab9c; }

    /* Bogaty kafelek na hover */
    .map-tip {
      position: absolute; z-index: 20; width: 236px; pointer-events: none;
      background: #fff; border: 1px solid var(--line); border-radius: 14px;
      box-shadow: 0 18px 40px -16px rgba(27,27,24,0.45);
      overflow: hidden; opacity: 0; transform: translateY(6px);
      transition: opacity .15s ease, transform .15s ease;
    }
    .map-tip.show { opacity: 1; transform: translateY(0); }
    .mt-photo { height: 108px; background: var(--paper-warm); position: relative; }
    .mt-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .mt-photo.noimg img { display: none; }
    .mt-photo.noimg::after { content: "🍽"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 30px; opacity: 0.3; }
    .mt-body { padding: 12px 14px 14px; }
    .mt-name { font-family: var(--font-serif); font-weight: 700; font-size: 1.15rem; color: var(--ink); }
    .mt-meta { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ink-soft); margin-top: 3px; }
    .mt-top { margin-top: 9px; font-size: 0.82rem; color: var(--ink); }
    .mt-top b { color: var(--accent-deep); }
    .mt-go { display: block; margin-top: 8px; font-family: var(--font-mono); font-size: 0.68rem; letter-spacing: 0.08em; color: var(--accent); }

    .map-legend { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; margin-top: 22px; font-family: var(--font-mono); font-size: 0.72rem; letter-spacing: 0.05em; color: var(--ink-soft); text-transform: uppercase; }
    .map-legend .swatch { display: inline-flex; align-items: center; gap: 8px; }
    .map-legend .box { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-dark); }

    @media (max-width: 640px) {
      .dist .d-name { font-size: 15px; }
      .dist .d-sub { display: none; }
      .river-label { font-size: 15px; }
      .map-tip { display: none; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/">Bite<span>Krakow</span></a>
    <nav class="site-nav">
      <a href="/guides/">Guides</a>
      <a href="/restaurants/">Places</a>
      <a href="/news/">News</a>
      <a href="/about/">About</a>
    </nav>
  </div>
</header>

<section class="wrap map-section">
  <span class="eyebrow">Prototype v2</span>
  <h2 class="deco">Pick your neighborhood</h2>
  <p class="section-lead">Krakow eats differently every few hundred meters. Hover a district for its top pick, tap to see where locals actually go.</p>

  <div class="map-wrap" id="mapWrap">
    <svg class="krk-map" viewBox="0 0 1000 730" role="img" aria-label="Map of Krakow food districts">
      <g id="rivers"></g>
      <g id="districts"></g>
      <g id="markers"></g>
    </svg>
    <div class="map-tip" id="mapTip">
      <div class="mt-photo" id="mtPhoto"><img id="mtImg" src="" alt=""></div>
      <div class="mt-body">
        <div class="mt-name" id="mtName"></div>
        <div class="mt-meta" id="mtMeta"></div>
        <div class="mt-top" id="mtTop"></div>
        <span class="mt-go" id="mtGo">View places ↗</span>
      </div>
    </div>
  </div>

  <div class="map-legend">
    <span class="swatch"><span class="box" style="background:#e7ddcb"></span> District with a full guide</span>
    <span class="swatch"><span class="box" style="background:#eee9df"></span> Covered in Places</span>
    <span class="swatch"><span class="box" style="background:#a3c1d6;border-color:#a3c1d6"></span> Vistula river</span>
  </div>
</section>

<script>
// Dzielnice w realnym ukladzie wzglednym. count/top z bazy (aktywne lokale).
var D = [
  { name:"Krowodrza", href:"/krowodrza-guide/", guide:true, count:8, top:"Cluster Cowork", slug:"cluster-cowork", rat:4.9,
    points:"55,72 225,58 272,150 228,224 110,214 48,142", label:[158,138] },
  { name:"Kleparz", href:"/kleparz-guide/", guide:true, count:11, top:"Moti Wine Bar", slug:"moti-wine-bar", rat:4.9,
    points:"298,60 468,52 505,142 442,192 312,180 286,116", label:[392,122] },
  { name:"Wesoła", href:"/restaurants/#wesola", guide:false, count:3, top:"Wesoła Cafe", slug:"wesola-cafe", rat:4.6,
    points:"560,150 686,158 706,246 636,292 560,272 546,202", label:[624,222] },
  { name:"Grzegórzki", href:"/restaurants/#grzegorzki", guide:false, count:1, top:"Lody na Starowiślnej", slug:"lody-starowislna", rat:4.7,
    points:"726,192 858,206 878,322 766,348 716,272 720,222", label:[792,272] },
  { name:"Piasek", href:"/restaurants/#piasek", guide:false, count:3, top:"Mazaya", slug:"mazaya", rat:4.7,
    points:"92,250 256,236 298,332 252,404 120,384 76,312", label:[186,322] },
  { name:"Stare Miasto", href:"/old-town-cafes/", guide:true, count:35, top:"Karma Coffee", slug:"karma-coffee", rat:4.5,
    points:"330,214 492,210 534,292 492,362 360,364 314,286", label:[424,290] },
  { name:"Salwator", href:"/restaurants/", guide:false, count:0, top:"", slug:"", rat:0,
    points:"70,432 198,418 238,488 190,548 86,538 48,482", label:[144,476] },
  { name:"Stradom", href:"/halal-krakow/", guide:false, count:0, top:"Bhajan Cafe", slug:"bhajan-cafe", rat:4.8,
    points:"362,380 454,374 474,424 414,456 354,432", label:[408,412] },
  { name:"Kazimierz", href:"/kazimierz-guide/", guide:true, count:32, top:"Hamsa", slug:"hamsa", rat:4.7,
    points:"490,378 614,368 664,422 632,474 512,482 472,430", label:[562,428] },
  { name:"Dębniki", href:"/restaurants/#debniki", guide:false, count:1, top:"Zaczyn", slug:"zaczyn", rat:4.6,
    points:"250,528 400,518 444,584 392,646 266,652 224,586", label:[336,586] },
  { name:"Podgórze", href:"/podgorze-guide/", guide:true, count:10, top:"Tacoteka", slug:"tacoteka", rat:4.8,
    points:"470,528 620,518 666,582 614,648 490,652 448,586", label:[556,586] },
  { name:"Zabłocie", href:"/restaurants/#zablocie", guide:false, count:4, top:"Del Jero", slug:"del-jero", rat:4.8,
    points:"690,522 834,512 880,578 824,640 706,632 662,570", label:[770,576] },
  { name:"Nowa Huta", href:"/restaurants/#nowa-huta", guide:false, mini:true, count:2, top:"Lody Mona", slug:"lody-mona", rat:5,
    points:"892,360 978,368 984,458 898,468 872,414", label:[930,412] },
];

var SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, parent){ var n=document.createElementNS(SVGNS,tag); for(var k in attrs) n.setAttribute(k,attrs[k]); if(parent) parent.appendChild(n); return n; }

// Rzeka Wisla: meander z wybrzuszeniem przy Wawelu
var rg = document.getElementById("rivers");
var RIVER = "M 8,512 C 120,502 205,508 262,504 C 330,499 356,468 408,462 C 456,457 486,472 522,480 C 604,498 664,474 726,496 C 808,524 866,556 1000,568";
el("path", { class:"river", d:RIVER }, rg);
el("path", { class:"river-2", d:RIVER }, rg);
var rl = el("text", { class:"river-label", x:150, y:486, transform:"rotate(-4 150 486)" }, rg);
rl.textContent = "Wisła";

// Dzielnice
var g = document.getElementById("districts");
D.forEach(function(d){
  var a = el("a", { class:"dist"+(d.mini?" mini":""), href:d.href, "aria-label":d.name }, g);
  el("polygon", { class:"shape", points:d.points, fill:d.guide?"#e7ddcb":"#eee9df", stroke:d.guide?"#e7ddcb":"#eee9df", "stroke-width":16 }, a);
  var name = el("text", { class:"d-name", x:d.label[0], y:d.label[1], "text-anchor":"middle" }, a);
  name.textContent = d.name;
  var sub = el("text", { class:"d-sub", x:d.label[0], y:d.label[1]+17, "text-anchor":"middle" }, a);
  sub.textContent = d.count ? (d.count + (d.count===1?" place":" places")) : "Explore";
  a.__d = d;
});

// Wawel na polnocnym brzegu przy zakolu
var m = document.getElementById("markers");
var wg = el("g", { transform:"translate(392 456)" }, m);
el("path", { class:"wawel-dot", d:"M0,14 V4 h3 v-3 h3 v3 h3 v-3 h3 v3 h3 V4 h3 v3 h3 v-3 h3 v3 h3 v10 z" }, wg);
el("rect", { class:"wawel-dot", x:20, y:-8, width:5, height:22 }, wg);
el("path", { class:"wawel-dot", d:"M25,-8 h9 l-3,3 3,3 h-9 z" }, wg);
var wl = el("text", { class:"wawel-label", x:40, y:8 }, wg); wl.textContent = "WAWEL";
var cN = el("text", { class:"compass", x:952, y:40, "text-anchor":"end" }, m); cN.textContent = "N ↑";
var cE = el("text", { class:"compass", x:952, y:352, "text-anchor":"end" }, m); cE.textContent = "→ NOWA HUTA";

// Bogaty kafelek na hover
var wrap = document.getElementById("mapWrap");
var tip = document.getElementById("mapTip");
var tImg = document.getElementById("mtImg"), tPhoto = document.getElementById("mtPhoto");
var tName = document.getElementById("mtName"), tMeta = document.getElementById("mtMeta"), tTop = document.getElementById("mtTop"), tGo = document.getElementById("mtGo");
function showTip(a){
  var d = a.__d;
  tName.textContent = d.name;
  tMeta.textContent = (d.count ? d.count + (d.count===1?" place":" places") : "Neighborhood") + (d.guide ? " · full guide" : "");
  if (d.top) { tTop.innerHTML = "Top pick: <b>"+d.top+"</b>" + (d.rat?' <span style="color:#8a8578">★ '+d.rat+"</span>":""); tTop.style.display=""; }
  else { tTop.style.display="none"; }
  tGo.textContent = d.guide ? "Read the guide ↗" : "View places ↗";
  if (d.slug) { tPhoto.classList.remove("noimg"); tImg.src = "https://bitekrakow.com/api/photo?slug="+d.slug; tImg.onerror=function(){ tPhoto.classList.add("noimg"); }; }
  else { tPhoto.classList.add("noimg"); tImg.removeAttribute("src"); }
  // pozycja: nad srodkiem dzielnicy, w granicach mapy
  var wr = wrap.getBoundingClientRect(), br = a.getBoundingClientRect();
  var cx = br.left - wr.left + br.width/2;
  var top = br.top - wr.top;
  var W = 236, x = cx - W/2;
  x = Math.max(10, Math.min(wr.width - W - 10, x));
  var y = top - tip.offsetHeight - 12;
  if (y < 8) y = br.bottom - wr.top + 12;
  tip.style.left = x + "px"; tip.style.top = y + "px";
  tip.classList.add("show");
}
function hideTip(){ tip.classList.remove("show"); }
Array.prototype.forEach.call(document.querySelectorAll(".dist"), function(a){
  a.addEventListener("mouseenter", function(){ showTip(a); });
  a.addEventListener("mouseleave", hideTip);
  a.addEventListener("focus", function(){ showTip(a); });
  a.addEventListener("blur", hideTip);
});
</script>
</body>
</html>
